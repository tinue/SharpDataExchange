[package]
name = "sharpdx"
version = "0.3.5"
edition = "2021"
description = "ROM-style Sharp PC-1500 / PC-1600 BASIC tokenizer / de-tokenizer (convert-verb parity)"
authors = ["Martin Erzberger <martin@erzberger.ch>"]
readme = "README.md"
license-file = "LICENSE"
publish = false

[lib]
name = "sharpdx"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "sde"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
serialport = { version = "4", optional = true }
libc = { version = "0.2", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
cpal = { version = "0.18.2", optional = true }

# The C ABI (`ffi`) never touches serial or audio, so embedders (e.g. Calc-U-1600) build
# with `--no-default-features --lib` and skip `serialport`, `cpal` and their platform
# library baggage.
[features]
default = ["cli"]
# The `sde` binary: `get`/`put` over serial, disk-image verbs, the argument parser,
# the local clock (disk directory timestamps) and `put -f wav` audio playback.
cli = ["serial", "audio", "dep:clap", "dep:chrono"]
# `get`/`put` serial transport modules.
serial = ["dep:serialport", "dep:libc"]
# `put -f wav`: play a tape through the default audio output (cpal; on Linux it needs
# the ALSA development package, e.g. `libasound2-dev`).
audio = ["dep:cpal"]

[build-dependencies]
cbindgen = "0.27"

[profile.release]
lto = true
strip = true

# Don't strip build-time artifacts (proc macros, build scripts): on macOS rustc strips
# with rust-objcopy, which leaves proc-macro dylibs that macOS 27 refuses to load
# ("mis-aligned LINKEDIT string pool"); see .cargo/config.toml. This covers the
# `--target` builds, where that file's target rustflags don't reach host artifacts.
# They never ship, so stripping them gains nothing.
[profile.release.build-override]
strip = false
