[package]
name = "sharpdx"
version = "0.1.3"
edition = "2021"
description = "ROM-style Sharp PC-1500 / PC-1600 BASIC tokenizer / de-tokenizer (convert-verb parity)"
authors = ["Martin Erzberger <martin@erzberger.ch>"]
readme = "README.md"
license-file = "LICENSE"
publish = false

[lib]
name = "sharpdx"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "sde"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[build-dependencies]
cbindgen = "0.27"

[profile.release]
lto = true
strip = true
