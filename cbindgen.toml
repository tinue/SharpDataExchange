language = "C"
header = "/* @generated by cbindgen from src/ffi/ — DO NOT EDIT. Regenerate via `cargo build`. */"
include_guard = "SHARPDX_H"
tab_width = 4
style = "type"
cpp_compat = true
usize_is_size_t = true
documentation = true
documentation_style = "c"

[export]
exclude = [
    "REM_CODE",
    # crate-internal constants (cpu_guess, info::problem); the C names are SDE_*
    "MIN_LEN", "WINDOW",
    "TRUNCATED", "TRAILING", "LEADING_NOISE", "HEADER_CUT", "BAD_PAYLOAD", "FATAL",
    # CLI-only (wav_cmd)
    "DEFAULT_SAMPLE_RATE", "MIN_WRITE_RATE",
    # crate-internal (transfer, floppy_image, diskfs); the C ABI has SDE_* equivalents
    "PC1600_NO_AUTORUN", "SIDE_SIZE", "FORMAT_VERSION", "NEW_FILE_ATTR", "NEW_FILE_YEAR_FIELD",
    "ATTR_PROTECTED", "ATTR_UNKNOWN_I", "ATTR_HIDDEN", "Geometry",
]

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
