language = "C"
header = "/* @generated by cbindgen from src/ffi/ — DO NOT EDIT. Regenerate via `cargo build`. */"
include_guard = "SHARPDX_H"
tab_width = 4
style = "type"
cpp_compat = true
usize_is_size_t = true
documentation = true
documentation_style = "c"

[export]
exclude = ["REM_CODE"]

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
