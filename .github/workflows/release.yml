name: Release

# Triggered by pushing a "vX.Y.Z-pre" tag: builds every platform and publishes
# a GitHub *pre-release* (disposable, re-runnable; see bin/release).
#
# The real "vX.Y.Z" release is never built here: `bin/release --release`
# promotes the pre-release's already-built assets to the real tag directly via
# `gh release create`, without pushing a tag that would trigger this workflow
# again — the pre-release build already is the release build. Use
# workflow_dispatch with a real tag only to force a rebuild (e.g. recovering
# from a botched promotion).
#
# Each platform job builds the `sde` CLI + the static and shared `libsharpdx`,
# bundles them with include/ + docs into one archive, and uploads it. The final
# job attaches every archive to the release.
#
# macOS is its own job (`build-macos`): it Developer-ID-signs the binaries,
# notarizes them, and additionally builds a notarized + stapled `.pkg` installer.
# It needs these repo secrets (see .github/macos-signing.md):
#   APPLE_CERT_APPLICATION_P12_BASE64  APPLE_CERT_INSTALLER_P12_BASE64
#   APPLE_CERT_P12_PASSWORD
#   APPLE_API_KEY_P8_BASE64  APPLE_API_KEY_ID  APPLE_API_ISSUER_ID

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-pre"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for, e.g. v0.1.0 or v0.1.0-pre"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            archive: sharpdx-linux-x86_64.tar.gz
            can-test: true
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
            archive: sharpdx-linux-aarch64.tar.gz
            can-test: true
          - name: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            archive: sharpdx-windows-x86_64.zip
            can-test: true
          - name: windows-aarch64
            os: windows-latest
            targets: aarch64-pc-windows-msvc
            archive: sharpdx-windows-aarch64.zip
            can-test: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Test
        if: matrix.can-test
        run: cargo test --release

      - name: Build
        shell: bash
        run: |
          IFS=',' read -ra TS <<< "${{ matrix.targets }}"
          for t in "${TS[@]}"; do
            cargo build --release --target "$t"
          done

      - name: Package
        shell: bash
        env:
          MATRIX_NAME: ${{ matrix.name }}
          TARGETS: ${{ matrix.targets }}
          ARCHIVE: ${{ matrix.archive }}
        run: bash .github/scripts/package.sh

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  build-macos:
    name: build macos-arm64 (signed + .pkg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"; VERSION="${VERSION%-pre}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import signing certificates
        env:
          APP_P12_B64: ${{ secrets.APPLE_CERT_APPLICATION_P12_BASE64 }}
          INSTALLER_P12_B64: ${{ secrets.APPLE_CERT_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"

          echo "$APP_P12_B64"       | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$INSTALLER_P12_B64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12"       -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          # Prepend our keychain to the search list, keeping the existing ones.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          APP_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n1)"
          INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Installer:.*\)"/\1/p' | head -n1)"
          if [ -z "$APP_IDENTITY" ] || [ -z "$INSTALLER_IDENTITY" ]; then
            echo "::error::missing Developer ID identity after import"; exit 1
          fi
          echo "APP_IDENTITY=$APP_IDENTITY"             >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KEYCHAIN"                >> "$GITHUB_ENV"

      - name: Codesign binaries (Developer ID Application, hardened runtime)
        run: |
          set -euo pipefail
          REL=target/aarch64-apple-darwin/release
          for f in "$REL/sde" "$REL/libsharpdx.dylib"; do
            codesign --force --timestamp --options runtime \
              --sign "$APP_IDENTITY" --keychain "$SIGN_KEYCHAIN" "$f"
            codesign --verify --strict --verbose=2 "$f"
          done

      - name: Package tarball
        env:
          MATRIX_NAME: macos-arm64
          TARGETS: aarch64-apple-darwin
          ARCHIVE: sharpdx-macos-arm64.tar.gz
        run: bash .github/scripts/package.sh

      - name: Write App Store Connect API key
        env:
          API_KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: echo "$API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/asc_api_key.p8"

      - name: Notarize the loose (tarball) binaries
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          REL=target/aarch64-apple-darwin/release
          mkdir -p "$RUNNER_TEMP/loose"
          cp "$REL/sde" "$REL/libsharpdx.dylib" "$RUNNER_TEMP/loose/"
          ditto -c -k --keepParent "$RUNNER_TEMP/loose" "$RUNNER_TEMP/loose.zip"
          xcrun notarytool submit "$RUNNER_TEMP/loose.zip" \
            --key "$RUNNER_TEMP/asc_api_key.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --wait --timeout 30m

      - name: Build the .pkg installer
        run: |
          set -euo pipefail
          bash .github/scripts/macos-pkg.sh \
            target/aarch64-apple-darwin/release/sde \
            "${{ steps.ver.outputs.version }}" \
            "SharpDataExchange-${{ steps.ver.outputs.version }}.pkg"

      - name: Notarize + staple the .pkg
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          PKG="SharpDataExchange-${{ steps.ver.outputs.version }}.pkg"
          xcrun notarytool submit "$PKG" \
            --key "$RUNNER_TEMP/asc_api_key.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"
          spctl -a -vvv -t install "$PKG"

      - uses: actions/upload-artifact@v6
        with:
          name: sharpdx-macos-arm64.tar.gz
          path: sharpdx-macos-arm64.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: sharpdx-macos-pkg
          path: SharpDataExchange-*.pkg
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc_api_key.p8"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

  publish:
    name: publish release
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # download-artifact v5+ lists/downloads artifacts via the Actions REST
      # API, which needs this explicitly once a job sets its own `permissions:`
      # block (that drops the default token's implicit actions:read) — without
      # it the download step 403s ("Failed to ListArtifacts").
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag + notes
        id: meta
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"; VERSION="${VERSION%-pre}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-pre ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          # Pull the matching CHANGELOG section, if any.
          notes=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { grab=1; next }
            grab && (/^## / || /^\[[^][]+\]: /) { exit }
            grab {
              if (!started && $0 ~ /^[[:space:]]*$/) next
              started = 1; buf = buf $0 "\n"
            }
            END { sub(/\n+$/, "\n", buf); printf "%s", buf }
          ' CHANGELOG.md)
          if [[ -z "${notes// }" ]]; then
            notes="Release $TAG. See CHANGELOG.md."
          fi
          { echo "notes<<EOF"; echo "$notes"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          NOTES: ${{ steps.meta.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          title="SharpDataExchange $VERSION"
          [[ "$PRERELEASE" == "true" ]] && title="$title (pre-release)"
          flag=""
          [[ "$PRERELEASE" == "true" ]] && flag="--prerelease"

          if gh release view "$TAG" >/dev/null 2>&1; then
            printf '%s\n' "$NOTES" | gh release edit "$TAG" --title "$title" --notes-file - $flag
            gh release upload "$TAG" dist/* --clobber
          else
            printf '%s\n' "$NOTES" | gh release create "$TAG" dist/* \
              --title "$title" --notes-file - $flag
          fi
          gh release view "$TAG" --json url -q .url
